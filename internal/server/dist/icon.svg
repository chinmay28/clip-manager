<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clip Manager">
  <!--
    A timeline of clips. The outer frame is the screen; the bars inside are
    recordings a few seconds long, laid out the way a camera writes them —
    unevenly, one after another. The red dot is the recorder, still going.

    Drawn on a 64px grid but sized down to 24px in the header, so everything is
    kept to thick strokes and wide gaps — thin detail turns to mud at that
    size. Rects only (rx=half-height makes the dot a circle): that is the whole
    of what scripts/make-icons.mjs can raster, and it must stay that way.
  -->
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>
  <rect x="8.5" y="8.5" width="47" height="47" rx="9" fill="none" stroke="#1e2d3d" stroke-width="3"/>
  <g fill="#0ea5e9">
    <rect x="17" y="18" width="19" height="8" rx="3"/>
    <rect x="40" y="18" width="7" height="8" rx="3" opacity="0.45"/>
    <rect x="17" y="30" width="30" height="8" rx="3"/>
    <rect x="17" y="42" width="11" height="8" rx="3" opacity="0.45"/>
  </g>
  <rect x="39" y="42" width="8" height="8" rx="4" fill="#ef4444"/>
</svg>
